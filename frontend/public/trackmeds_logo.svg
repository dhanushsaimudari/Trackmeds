<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="resilienceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F5B" />
      <stop offset="100%" stop-color="#003580" />
    </linearGradient>

    <linearGradient id="innovationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006CD4" />
      <stop offset="100%" stop-color="#00BCD4" />
    </linearGradient>

    <linearGradient id="cooperationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00897B" />
      <stop offset="100%" stop-color="#004D40" />
    </linearGradient>

    <linearGradient id="sustainabilityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#001F5B" flood-opacity="0.18" />
    </filter>
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00BCD4" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- ==================== LOGO ICON / EMBLEM ==================== -->
  <g transform="translate(145, 230)" filter="url(#softGlow)">
    <!-- Dynamic Orbit Ring: Inter-Facility Redistribution & Telemetry Loop -->
    <ellipse cx="0" cy="0" rx="98" ry="38" 
             transform="rotate(-30)" 
             fill="none" 
             stroke="url(#innovationGrad)" 
             stroke-width="3" 
             stroke-dasharray="6 4" 
             opacity="0.75" />

    <!-- Autonomous Logistics Nodes on Orbit -->
    <circle cx="78" cy="-45" r="4.5" fill="#00BCD4" filter="url(#nodeGlow)" />
    <circle cx="-78" cy="45" r="4.5" fill="#00897B" />
    
    <!-- Central Modern Capsule Body (Angled at 45deg) -->
    <g transform="rotate(-45)">
      <!-- Left Hemisphere / Medicine Core: Resilience Navy -->
      <path d="M -54,-28 
               L 0,-28 
               L 0,28 
               L -54,28 
               A 28,28 0 0,1 -54,-28 Z" 
            fill="url(#resilienceGrad)" />
      
      <!-- Right Hemisphere / Ecological & Logistics Sustainability: Forest Green & Teal -->
      <path d="M 0,-28 
               L 54,-28 
               A 28,28 0 0,1 54,28 
               L 0,28 Z" 
            fill="url(#sustainabilityGrad)" />
      
      <!-- Capsule Center Divider Seam -->
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />

      <!-- Inner Cross Symbol: Primary Healthcare Anchor -->
      <path d="M -31,-12 L -23,-12 L -23,-20 L -15,-20 L -15,-12 L -7,-12 L -7,-4 L -15,-4 L -15,4 L -23,4 L -23,-4 L -31,-4 Z" 
            fill="#FFFFFF" 
            opacity="0.95" />

      <!-- Inner Connected Network Nodes: FEFO Engine & Cross-Facility Routing -->
      <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.95">
        <line x1="14" y1="-10" x2="26" y2="8" />
        <line x1="26" y1="8" x2="38" y2="-6" />
        <circle cx="14" cy="-10" r="3.5" fill="#00BCD4" stroke="#FFFFFF" stroke-width="1.5" />
        <circle cx="26" cy="8" r="3.5" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5" />
        <circle cx="38" cy="-6" r="3.5" fill="#FFFFFF" stroke="#001F5B" stroke-width="1.5" />
      </g>
    </g>

    <!-- Radar Pulse / Real-time Telemetry Arcs (Innovation Signal) -->
    <path d="M 52,-60 A 85,85 0 0,1 82,-20" fill="none" stroke="#00BCD4" stroke-width="3" stroke-linecap="round" />
    <path d="M 64,-72 A 105,105 0 0,1 102,-22" fill="none" stroke="#006CD4" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- ==================== TYPOGRAPHY & BRANDING ==================== -->
  <text x="290" y="215" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
        font-size="54" 
        font-weight="900" 
        letter-spacing="-1">
    <tspan fill="#001F5B">TRACK</tspan><tspan fill="#00897B">MEDS</tspan>
  </text>

  <!-- National / Federated Status Badge -->
  <rect x="585" y="174" width="70" height="22" rx="5" fill="#E0F2FE" />
  <text x="620" y="189" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
        font-size="10.5" 
        font-weight="700" 
        fill="#006CD4" 
        text-anchor="middle" 
        letter-spacing="0.8">DPI • AI</text>

  <!-- Technical Description -->
  <text x="292" y="250" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
        font-size="14.5" 
        font-weight="600" 
        fill="#334155" 
        letter-spacing="1.2">
    AUTONOMOUS HEALTH SUPPLY CHAIN COMMAND
  </text>

  <!-- The 4 Strategic Pillars Indicators -->
  <g transform="translate(292, 280)">
    <circle cx="5" cy="0" r="4.5" fill="#001F5B" />
    <text x="15" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#001F5B" letter-spacing="0.5">RESILIENCE</text>
    <text x="88" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94A3B8">•</text>

    <circle cx="102" cy="0" r="4.5" fill="#006CD4" />
    <text x="112" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#006CD4" letter-spacing="0.5">INNOVATION</text>
    <text x="194" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94A3B8">•</text>

    <circle cx="208" cy="0" r="4.5" fill="#00897B" />
    <text x="218" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#00897B" letter-spacing="0.5">COOPERATION</text>
    <text x="312" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94A3B8">•</text>

    <circle cx="326" cy="0" r="4.5" fill="#2E7D32" />
    <text x="336" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#2E7D32" letter-spacing="0.5">SUSTAINABILITY</text>
  </g>
</svg>
